<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Физика — справочник</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>



  <header class="header">
    <div class="container header-cont">

      <div class="logo">
          <span>Справочник</span>
      </div>


      <div class="search">
        <input type="text" id="searchInput" placeholder="Поиск по темам...">
      </div>

    </div>
  </header>




  <main>

    <div class="layout">

      <aside class="sidebar" id="sidebar">
        <!-- разделы и темы подставляются через script.js -->
      </aside>

      <div class="content-wrap">
        <div class="content" id="content">
          <!-- выбранная тема / раздел подставляется через script.js -->
        </div>
      </div>

    </div>

  </main>





  <footer class="footer">
    <div class="container">

      <p>© 2026 Справочник по физике</p>

    </div>
  </footer>

  <script src="script.js"></script>

</body>
</html>
